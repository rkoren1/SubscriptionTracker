version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: subscriptiontracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: subscriptiontracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
